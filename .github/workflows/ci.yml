name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Unit-Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: MCP-Bündel (api/mcp.js) ist aktuell
        run: |
          npm run build:mcp
          git diff --exit-code -- api/mcp.js || (echo "api/mcp.js ist veraltet: bitte 'npm run build:mcp' ausführen und committen." && exit 1)
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Datenbank-Rechte & End-to-End
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase lokal starten
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Umgebungsvariablen für die App
        run: |
          supabase status -o env > /tmp/sb.env
          source /tmp/sb.env
          echo "VITE_SUPABASE_URL=$API_URL" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.local
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Rechte-Tests (RLS, Storage, Einladungen)
        run: npm run test:db
      - name: MCP-Konnektor (OAuth, alle Tools, Rechte)
        run: npm run test:mcp
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
